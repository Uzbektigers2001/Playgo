<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Reset your Playgo password</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f7f7f7; margin:0; padding:24px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; padding:32px;">
          <tr>
            <td>
              <h1 style="color:#222; margin-top:0;">Hi {{userName}},</h1>
              <p style="color:#444; line-height:1.5;">
                We received a request to reset your Playgo password.
                Click the button below within the next hour to choose a new one.
              </p>
              <p style="margin:32px 0;">
                <a href="{{resetLink}}"
                   style="background:#e50914; color:#ffffff; padding:14px 24px; text-decoration:none; border-radius:4px; display:inline-block;">
                  Reset password
                </a>
              </p>
              <p style="color:#888; font-size:12px;">
                If you did not request a password reset, you can safely ignore this email — your password will stay the same.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
